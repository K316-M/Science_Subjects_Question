<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="化学科背景">
  <title>化学科背景</title>
  <!-- 与生物科同一套系统：中性底色 → 几团大范围柔色 → 一个低对比的主题符号。
       化学的符号是分子晶格（六角环链），刻意画成抽象的结构而不是玻璃器皿。 -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#fdfcfe"/><stop offset="55%" stop-color="#f8f6fd"/><stop offset="100%" stop-color="#f1ecfb"/>
    </linearGradient>
    <radialGradient id="m1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c4b5fd" stop-opacity=".30"/><stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
    <radialGradient id="m2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f9a8d4" stop-opacity=".22"/><stop offset="100%" stop-color="#f9a8d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="m3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a5f3fc" stop-opacity=".26"/><stop offset="100%" stop-color="#a5f3fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="m4" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ddd6fe" stop-opacity=".30"/><stop offset="100%" stop-color="#ddd6fe" stop-opacity="0"/></radialGradient>
    <radialGradient id="clear" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".74"/><stop offset="70%" stop-color="#ffffff" stop-opacity=".30"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 一颗六角环，之後沿对角线重复摆放成晶格 -->
    <g id="hex"><polygon points="0,-3.4 2.95,-1.7 2.95,1.7 0,3.4 -2.95,1.7 -2.95,-1.7"/></g>
  </defs>

  <style>
    .motif { fill: none; stroke: #5b21b6; stroke-opacity: .12; stroke-width: .5; stroke-linejoin: round; }
    .bond { stroke-opacity: .08; stroke-linecap: round; }
    .dot { fill: #5b21b6; fill-opacity: .11; }
    .drift { animation: drift 30s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(1.1px,-.9px); } }
    @media (prefers-reduced-motion: reduce) { .drift { animation: none; } }
    @media (min-width: 900px) { .drift { animation: none; } }
  </style>

  <rect width="100" height="100" fill="url(#base)"/>
  <ellipse cx="10" cy="14" rx="44" ry="36" fill="url(#m1)"/>
  <ellipse cx="92" cy="18" rx="40" ry="32" fill="url(#m2)"/>
  <ellipse cx="90" cy="84" rx="46" ry="38" fill="url(#m4)"/>
  <ellipse cx="4"  cy="82" rx="38" ry="34" fill="url(#m3)"/>
  <ellipse cx="54" cy="4"  rx="30" ry="20" fill="url(#m1)"/>

  <g class="drift">
    <g class="motif">
      <use href="#hex" x="8"  y="92"/><use href="#hex" x="13.9" y="88.6"/><use href="#hex" x="13.9" y="95.4"/>
      <use href="#hex" x="19.8" y="85.2"/><use href="#hex" x="25.7" y="81.8"/>
      <use href="#hex" x="88" y="14"/><use href="#hex" x="93.9" y="10.6"/><use href="#hex" x="93.9" y="17.4"/>
      <use href="#hex" x="82.1" y="10.6"/><use href="#hex" x="82.1" y="17.4"/>
      <g class="bond">
        <path d="M31 79 L 44 71"/><path d="M44 71 L 44 60"/><path d="M44 60 L 57 52"/>
        <path d="M57 52 L 70 56"/><path d="M57 52 L 57 41"/><path d="M70 56 L 78 48"/>
      </g>
    </g>
    <circle class="dot" cx="44" cy="71" r=".85"/><circle class="dot" cx="44" cy="60" r=".7"/>
    <circle class="dot" cx="57" cy="52" r=".95"/><circle class="dot" cx="70" cy="56" r=".7"/>
    <circle class="dot" cx="57" cy="41" r=".7"/><circle class="dot" cx="78" cy="48" r=".8"/>
  </g>

  <rect width="100" height="100" fill="url(#clear)"/>
</svg>
