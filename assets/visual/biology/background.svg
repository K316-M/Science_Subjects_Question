<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="生物科背景">
  <title>生物科背景</title>
  <!-- 设计说明（第二轮）：
       从「四角各放一组线稿」改成「一整片氛围 + 一个克制的主题符号」。
       四角贴图读起来像剪贴画，而且四个角各讲一件事，会跟中央的内容抢注意力。
       现在是：近乎中性的底色 → 几团大范围的柔色（mesh gradient）→ 一个低对比的
       主题符号从边缘掠过。内容永远是画面上最清楚的东西。 -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#fdfdfb"/>
      <stop offset="55%"  stop-color="#f7faf8"/>
      <stop offset="100%" stop-color="#eef6f1"/>
    </linearGradient>
    <radialGradient id="m1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".30"/><stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac" stop-opacity=".26"/><stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity=".22"/><stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity=".24"/><stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <!-- 中央留白：把色场往外推，内容区维持乾净 -->
    <radialGradient id="clear" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* 主题符号刻意压到很低的对比：认得出是什麼，但不会被「读」到 */
    .motif { fill: none; stroke: #0f766e; stroke-opacity: .13; stroke-width: .55; stroke-linecap: round; }
    .motif-soft { stroke-opacity: .07; }
    .dot { fill: #0f766e; fill-opacity: .12; }
    .drift { animation: drift 26s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-1.2px, .9px); } }
    @media (prefers-reduced-motion: reduce) { .drift { animation: none; } }
    /* 大屏静止：背景一动，介面的毛玻璃每帧都要重算（实测 60→18 fps） */
    @media (min-width: 900px) { .drift { animation: none; } }
  </style>

  <rect width="100" height="100" fill="url(#base)"/>

  <!-- 色场：位置刻意不对称，才不会像「装饰框」 -->
  <ellipse cx="14" cy="16" rx="46" ry="38" fill="url(#m1)"/>
  <ellipse cx="88" cy="10" rx="38" ry="30" fill="url(#m3)"/>
  <ellipse cx="96" cy="72" rx="44" ry="40" fill="url(#m2)"/>
  <ellipse cx="6"  cy="88" rx="40" ry="34" fill="url(#m4)"/>
  <ellipse cx="62" cy="96" rx="34" ry="24" fill="url(#m1)"/>

  <!-- 一个符号，不是四个：双螺旋从左下斜掠到右上，绝大部分在内容区之外 -->
  <g class="drift">
    <g class="motif">
      <path d="M-6 104 C 14 92, 6 76, 24 66 C 42 56, 34 40, 52 30 C 70 20, 62 6, 80 -4"/>
      <path class="motif-soft" d="M2 106 C 22 94, 14 78, 32 68 C 50 58, 42 42, 60 32 C 78 22, 70 8, 88 -2"/>
      <g stroke-opacity=".09">
        <path d="M-1 99 L 4.5 101"/><path d="M8 89 L 13 91"/><path d="M17 79 L 22 81"/>
        <path d="M27 69 L 32 71"/><path d="M36 59 L 41 61"/><path d="M45 49 L 50 51"/>
        <path d="M54 39 L 59 41"/><path d="M63 29 L 68 31"/><path d="M72 19 L 77 21"/>
      </g>
    </g>
    <circle class="dot" cx="24" cy="66" r=".9"/>
    <circle class="dot" cx="52" cy="30" r=".75"/>
    <circle class="dot" cx="80" cy="-4" r=".8"/>
  </g>

  <!-- 内容区的留白罩：最後盖上，确保中间永远最乾净 -->
  <rect width="100" height="100" fill="url(#clear)"/>
</svg>
