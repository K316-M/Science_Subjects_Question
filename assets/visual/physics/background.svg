<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="物理科背景">
  <title>物理科背景</title>
  <!-- 与生物、化学同一套系统。物理的符号是从左下角发散的波前，
       抽象、连续，而不是棱镜或磁铁那种具体物件。 -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#fcfdfe"/><stop offset="55%" stop-color="#f5f9fd"/><stop offset="100%" stop-color="#eaf2fb"/>
    </linearGradient>
    <radialGradient id="m1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7dd3fc" stop-opacity=".28"/><stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="m2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fde68a" stop-opacity=".24"/><stop offset="100%" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
    <radialGradient id="m3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c7d2fe" stop-opacity=".30"/><stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/></radialGradient>
    <radialGradient id="m4" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#bae6fd" stop-opacity=".26"/><stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/></radialGradient>
    <radialGradient id="clear" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".74"/><stop offset="70%" stop-color="#ffffff" stop-opacity=".30"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .motif { fill: none; stroke: #1e3a8a; stroke-opacity: .10; stroke-width: .5; }
    .faint { stroke-opacity: .06; }
    .dot { fill: #1e3a8a; fill-opacity: .12; }
    .drift { animation: drift 28s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(.9px,1.1px); } }
    @media (prefers-reduced-motion: reduce) { .drift { animation: none; } }
    @media (min-width: 900px) { .drift { animation: none; } }
  </style>

  <rect width="100" height="100" fill="url(#base)"/>
  <ellipse cx="12" cy="12" rx="42" ry="34" fill="url(#m1)"/>
  <ellipse cx="94" cy="16" rx="38" ry="30" fill="url(#m2)"/>
  <ellipse cx="88" cy="88" rx="44" ry="38" fill="url(#m3)"/>
  <ellipse cx="2"  cy="78" rx="40" ry="36" fill="url(#m4)"/>
  <ellipse cx="58" cy="100" rx="34" ry="22" fill="url(#m1)"/>

  <!-- 波前：从左下角外侧的点发散，只有跨过画面的那几圈看得见 -->
  <g class="drift">
    <g class="motif">
      <circle cx="-4" cy="106" r="34"/><circle cx="-4" cy="106" r="46"/>
      <circle cx="-4" cy="106" r="58" class="faint"/><circle cx="-4" cy="106" r="72" class="faint"/>
      <circle cx="-4" cy="106" r="88" class="faint"/>
    </g>
    <g class="motif faint">
      <circle cx="104" cy="-6" r="30"/><circle cx="104" cy="-6" r="42"/><circle cx="104" cy="-6" r="56"/>
    </g>
    <circle class="dot" cx="-4" cy="106" r="1.2"/>
    <circle class="dot" cx="104" cy="-6" r="1"/>
  </g>

  <rect width="100" height="100" fill="url(#clear)"/>
</svg>
