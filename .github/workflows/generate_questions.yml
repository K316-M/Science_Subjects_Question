name: AI 依考纲出题 (Generate Questions)

# 每周自动挑出题目最少的章节，请 Gemini 依考纲撰写原创练习题，
# 通过自动检查的直接推进 main 的待审区（不开 PR），到 /dev「AI 录题待审」逐题审核。
# 每周自动跑的那次：待审区还有上一批 AI 出的题没审完就先不出（手动跑不受影响）。
# 出题报告在这次执行的摘要（Actions → 点这次执行）。
#
# 与「AI 自动录题」的分工：
#   ingest_paper.yml      → 把你拍的真题照片转写成题目
#   generate_questions.yml → 依考纲生成全新的原创练习题（必须人工核对科学正确性）
#
# 使用前请在 Settings → Secrets and variables → Actions 添加 GEMINI_API_KEY。

on:
  schedule:
    # 每周一 01:00 UTC（马来西亚时间早上 9 点）
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      subject:
        description: '只为某一科出题（留空＝三科都跑）'
        required: false
        default: ''
        type: choice
        options: ['', 'biology', 'chemistry', 'physics']
      chapters_per_run:
        description: '这次照顾几个章节'
        required: false
        default: '3'
      questions_per_chapter:
        description: '每个章节出几题'
        required: false
        default: '4'

# 连推好几次时排队一个一个跑（推送时遇到 main 刚被改动会自己重取再接，不会冲突）。
# 录题与出题各自一组：GitHub 同一组只留一个排队的，共用一组会把排队中的另一个取消掉
concurrency:
  group: generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（读取 PDF 考纲用）
        run: pip install --quiet pypdf

      - name: 依考纲生成原创题并自动检查
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_SUBJECT: ${{ inputs.subject }}
          CHAPTERS_PER_RUN: ${{ inputs.chapters_per_run || '3' }}
          QUESTIONS_PER_CHAPTER: ${{ inputs.questions_per_chapter || '4' }}
        run: |
          python scripts/generate_questions.py
          if [ -f has_new_generated.txt ] && [ "$(cat has_new_generated.txt)" = "true" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 新题推进待审区（直接推到 main）
        if: steps.generate.outputs.has_new == 'true'
        run: bash scripts/push_pending.sh "🤖 AI 依考纲出题进待审区 · 批次 #${{ github.run_number }}"

      - name: 出题报告放进这次执行的摘要
        if: always()
        run: if [ -f GENERATION_REPORT.md ]; then cat GENERATION_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
