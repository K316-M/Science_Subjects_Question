name: BioQuestion Auto Pipeline & Health Check

on:
  # 场景 1：当您向 papers/ 文件夹上传新照片时立刻触发
  push:
    paths:
      - 'papers/**.jpg'
      - 'papers/**.jpeg'
      - 'papers/**.png'
  # 场景 2：定时执行（每周一凌晨 2 点自动挖掘难题与巡检 Bug）
  schedule:
    - cron: '0 18 * * 0' # 对应马来西亚时间周一凌晨 2:00
  # 场景 3：支持手机端在 GitHub 页面点击手动一键触发
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install google-generativeai

      - name: 执行审题、自动入库与网站缺陷巡检
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_inspector.py

      - name: 自动提交更新至私有仓库
        run: |
          git config --global user.name "Inspector-Bot"
          git config --global user.email "bot@independent-school.edu"
          git add papers/biology_question_bank.json
          git commit -m "🤖 [Auto-Pipeline] 题库自动审题入库与缺陷修复" || echo "无更新变动"
          git push
