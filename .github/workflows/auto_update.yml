name: BioQuestion Auto Pipeline & Health Check

on:
  schedule:
    # 每周一上午 8:00 (UTC 0:00) 自动巡检
    - cron: '0 0 * * 1'
  push:
    paths:
      - 'papers/*_question_bank.json'   # 只有正式题库变了才巡检；待审区的进出不用
  workflow_dispatch: # 支持手动点按测试

# /dev 连续采纳好几题时会连推好几次：只跑最新那次，前面还在跑的直接取消
concurrency:
  group: inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # 必须开启 Issue 写入权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行题库体检与报告生成
        id: inspect
        run: |
          python scripts/auto_inspector.py
          echo "has_issues=$(cat has_issues.txt)" >> "$GITHUB_OUTPUT"

      - name: 自动提交更新检讨报告文件
        run: |
          git config --global user.name "Inspector-Bot"
          git config --global user.email "bot@independent-school.edu"
          git add docs/INSPECTION_REPORT.md
          git commit -m "📋 [Report] 更新题库自检报告" || echo "报告无变动"
          # 跑的这几十秒里 /dev 可能又采纳了一题：先接上最新的 main 再推（报告只有这里会改，不会冲突）
          git pull --rebase --quiet origin main
          git push

      # 放题期间几乎每采纳一题就跑一次：只维护同一个 Issue，不要每次开新的
      - name: 找还开着的巡检 Issue
        id: open_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "${{ github.repository }}" --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("🚨 题库巡检"))][0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: 有问题：更新那个 Issue（没有才开新的）
        if: steps.inspect.outputs.has_issues == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚨 题库巡检检讨报告（有待补充图片或确认答案）"
          content-filepath: docs/INSPECTION_REPORT.md
          issue-number: ${{ steps.open_issue.outputs.number }}
          labels: "题库维护, 待修改"

      - name: 全部正常：关掉还开着的巡检 Issue
        if: steps.inspect.outputs.has_issues != 'true' && steps.open_issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ steps.open_issue.outputs.number }}" --repo "${{ github.repository }}" --comment "巡检全部正常，自动关闭。"
