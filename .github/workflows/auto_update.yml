name: BioQuestion Auto Pipeline & Health Check

on:
  schedule:
    # 每周一上午 8:00 (UTC 0:00) 自动巡检
    - cron: '0 0 * * 1'
  push:
    paths:
      - 'papers/**'
  workflow_dispatch: # 支持手动点按测试

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # 必须开启 Issue 写入权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行题库体检与报告生成
        run: |
          python scripts/auto_inspector.py

      - name: 自动提交更新检讨报告文件
        run: |
          git config --global user.name "Inspector-Bot"
          git config --global user.email "bot@independent-school.edu"
          git add INSPECTION_REPORT.md
          git commit -m "📋 [Report] 更新题库自检报告" || echo "报告无变动"
          git push

      - name: 若发现缺陷，自动在 GitHub 创建 Issue 提醒您
        if: hashFiles('has_issues.txt') != ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚨 题库巡检检讨报告（有待补充图片或确认答案）"
          content-filepath: INSPECTION_REPORT.md
          labels: "题库维护, 待修改"
