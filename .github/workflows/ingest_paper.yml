name: AI 自动录题流水线 (Ingest Drafts)

# 管理员把题目档（照片、PDF、Word .docx、PowerPoint .pptx、纯文字）丢进
# drafts/<biology|chemistry|physics>/ 并推送，本工作流调用 Gemini 转写题目、
# 自动审题（格式、重复、答案复核），直接推进 main 的待审区（不开 PR：每批都改同一个待审区档案，
# 两批同时开着就一定冲突）。之後到 /dev「AI 录题待审」采纳才会上线。
# 录题报告在这次执行的摘要（Actions → 点这次执行）；有档案处理失败（例如旧版 .doc）另开 Issue。
#
# 使用前请先在仓库 Settings -> Secrets and variables -> Actions 中添加：
#   GEMINI_API_KEY  你的 Gemini API Key

on:
  push:
    branches: [main]
    paths:
      - 'drafts/**'
  workflow_dispatch:

# 连推好几次时排队一个一个跑（推送时遇到 main 刚被改动会自己重取再接，不会冲突）。
# 录题与出题各自一组：GitHub 同一组只留一个排队的，共用一组会把排队中的另一个取消掉
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          # 取开跑当下最新的 main，不是触发这次的那个 commit：连推两次时，第二次排队等第一次跑完，
          # 要看得到第一次已经删掉的原档与放进待审区的题，才不会把同一批再录一遍
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（照片转正、PDF 转图，用来裁配图）
        run: pip install --quiet pillow pypdfium2

      - name: 运行 AI 自动录题脚本
        id: ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ingest_drafts.py
          if [ -f has_new_ingest.txt ] && [ "$(cat has_new_ingest.txt)" = "true" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f has_ingest_problems.txt ] && [ "$(cat has_ingest_problems.txt)" = "true" ]; then
            echo "has_problems=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f has_new_ingest.txt has_ingest_problems.txt

      - name: 新题推进待审区（直接推到 main，连同删掉的原档与裁好的配图）
        if: steps.ingest.outputs.has_new == 'true'
        run: bash scripts/push_pending.sh "🧪 AI 录题进待审区 · 批次 #${{ github.run_number }}" drafts images

      - name: 录题报告放进这次执行的摘要
        if: always()
        run: if [ -f INGEST_REPORT.md ]; then cat INGEST_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: 有档案没处理成功：开 Issue 提醒
        if: steps.ingest.outputs.has_problems == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "⚠️ AI 录题：有档案没处理成功"
          content-filepath: INGEST_REPORT.md
          labels: "AI录题"
