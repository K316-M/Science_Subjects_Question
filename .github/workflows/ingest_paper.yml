name: AI 自动录题流水线 (Ingest Drafts)

# 管理员把题目档（照片、PDF、Word .docx、PowerPoint .pptx、纯文字）丢进
# drafts/<biology|chemistry|physics>/ 并推送，本工作流调用 Gemini 转写题目、
# 自动审题（格式、重复、答案复核），写进待审区并开一个 Pull Request。
# 没录到题但有档案失败（例如旧版 .doc）时改开 Issue，不会再静默结束。
#
# 使用前请先在仓库 Settings -> Secrets and variables -> Actions 中添加：
#   GEMINI_API_KEY  你的 Gemini API Key

on:
  push:
    branches: [main]
    paths:
      - 'drafts/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 AI 自动录题脚本
        id: ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ingest_drafts.py
          if [ -f has_new_ingest.txt ] && [ "$(cat has_new_ingest.txt)" = "true" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f has_ingest_problems.txt ] && [ "$(cat has_ingest_problems.txt)" = "true" ]; then
            echo "has_problems=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f has_new_ingest.txt has_ingest_problems.txt

      - name: 创建待审核 Pull Request
        if: steps.ingest.outputs.has_new == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ingest/auto-${{ github.run_number }}
          commit-message: "🧪 AI 自动录题：待审核批次 #${{ github.run_number }}"
          title: "🧪 AI 自动录题待审核 · 批次 #${{ github.run_number }}"
          body-path: INGEST_REPORT.md
          labels: "待审核, AI录题"

      - name: 没录到题但有档案失败：开 Issue 提醒
        if: steps.ingest.outputs.has_new != 'true' && steps.ingest.outputs.has_problems == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "⚠️ AI 录题：有档案没处理成功"
          content-filepath: INGEST_REPORT.md
          labels: "AI录题"
