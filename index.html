<!DOCTYPE html>
<html lang="zh-MY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独中理科自主学习系统 · 生物科</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #ecfdf5;
      --bg-nature: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #f7fee7 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(226, 232, 240, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --hl-yellow: #fef08a;
      --hl-green: #bbf7d0;
      --hl-pink: #fbcfe8;
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 26px -6px rgba(5, 150, 105, 0.16);
      --shadow-form: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-nature);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 860px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
    }
    .brand { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .sound-toggle {
      background: #fff;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .sound-toggle:hover { border-color: var(--primary); transform: translateY(-1px); }

    .breadcrumbs { font-size: 13px; color: var(--text-muted); }
    .breadcrumb-item { cursor: pointer; transition: color 0.2s; }
    .breadcrumb-item:hover { color: var(--primary); text-decoration: underline; }
    .breadcrumb-item.active { color: var(--text-main); font-weight: 700; cursor: default; text-decoration: none; }

    .view { display: none; }
    .view.active { display: block; animation: softFadeIn 0.25s ease; }
    @keyframes softFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .grid-subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 18px; }
    .subject-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 18px;
      cursor: pointer;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .subject-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: var(--shadow-md); background: #fff; }
    .subject-icon { font-size: 42px; margin-bottom: 8px; }
    .subject-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .subject-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

    /* PPT 章节大纲竖型书签轨道 */
    .chapter-bookmark-rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 6px 4px 16px 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .chapter-bookmark-rail::-webkit-scrollbar { display: none; }

    .chapter-card {
      flex: 0 0 130px;
      height: 126px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .chapter-card:hover { transform: translateY(-3px); border-color: var(--primary); background: #fff; }
    .chapter-card.active {
      background: #ffffff;
      border-color: var(--primary);
      border-width: 2px;
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
    }
    .chapter-card.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      width: 18px;
      height: 4px;
      background: var(--primary);
      border-radius: 4px;
    }
    .chap-badge { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 2px 7px; border-radius: 8px; }
    .chap-name { font-size: 13px; font-weight: 700; color: #1e293b; text-align: center; line-height: 1.35; margin: 4px 0; }
    .chap-count { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    /* 二级分类胶囊标签 */
    .sub-bookmark-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      background: rgba(255, 255, 255, 0.6);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      width: fit-content;
    }
    .sub-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .sub-tab-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* 闪卡样式 */
    .flashcard {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: var(--shadow-sm);
    }
    .mcq-question { font-size: 16px; font-weight: 600; line-height: 1.7; margin-bottom: 16px; white-space: pre-line; color: #1e293b; }

    .figure-container {
      margin: 12px 0 18px 0;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: zoom-in;
    }
    .figure-container img { max-width: 100%; max-height: 280px; object-fit: contain; border-radius: 8px; }
    .figure-caption { font-size: 12px; color: var(--accent); margin-top: 8px; font-weight: 600; }

    .mcq-options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      color: #334155;
      text-align: left;
      padding: 13px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.5;
      transition: all 0.2s;
    }
    .option-btn:hover:not(.locked) { border-color: var(--primary); background: #f0fdf4; transform: translateX(3px); }
    .option-btn.correct { background: #ecfdf5 !important; border-color: var(--success) !important; color: #065f46 !important; font-weight: 700; cursor: default; }
    .option-btn.wrong { background: #fef2f2; border-color: var(--danger); color: #991b1b; }
    .option-btn.locked { cursor: default; }

    .explanation {
      margin-top: 18px;
      padding: 16px;
      background: #f0fdf4;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: #166534;
      border-left: 4px solid var(--primary);
      display: none;
    }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid #e2e8f0; }
    .btn-nav { background: #fff; border: 1px solid #cbd5e1; color: #334155; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-nav:hover { border-color: var(--primary); color: var(--primary); }

    /* Google 表单式大卡片排版 */
    .form-style-container { display: flex; flex-direction: column; gap: 28px; }
    .form-question-card {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      box-shadow: var(--shadow-form);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .form-question-card:hover { box-shadow: 0 14px 28px -4px rgba(0,0,0,0.08); }
    .form-card-top-bar { height: 6px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
    .form-card-body { padding: 26px 24px; }
    .form-question-text { font-size: 16px; font-weight: 700; color: #0f172a; line-height: 1.8; margin-bottom: 20px; white-space: pre-line; }

    /* 翻转背书闪卡 */
    .answer-flip-panel {
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      background: #f8fafc;
    }
    .flip-toggle-header {
      padding: 12px 18px;
      background: #f1f5f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: background 0.2s;
    }
    .flip-toggle-header:hover { background: #e2e8f0; }
    .flip-toggle-title { font-size: 13px; font-weight: 700; color: #475569; display: flex; align-items: center; gap: 6px; }
    .flip-status-pill { font-size: 11px; font-weight: 600; color: var(--primary); background: #fff; padding: 3px 8px; border-radius: 12px; }

    .flip-answer-content {
      padding: 20px;
      display: none;
      font-size: 14.5px;
      line-height: 1.9;
      color: #334155;
      background: #fff;
      animation: softFadeIn 0.2s ease;
    }
    .flip-answer-content.revealed { display: block; }

    .hl-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .hl-color-btn { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .hl-color-btn.selected { border-color: #0f172a; transform: scale(1.18); }
    .hl-btn-action { background: #fff; border: 1px solid #cbd5e1; color: #334155; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    
    .hl-mark-yellow { background-color: var(--hl-yellow); color: #854d0e; padding: 2px 4px; border-radius: 3px; font-weight: 500; }
    .hl-mark-green { background-color: var(--hl-green); color: #166534; padding: 2px 4px; border-radius: 3px; font-weight: 500; }
    .hl-mark-pink { background-color: var(--hl-pink); color: #9d174d; padding: 2px 4px; border-radius: 3px; font-weight: 500; }
    .status-toast { font-size: 12px; color: var(--primary); font-weight: 600; margin-left: auto; }

    .img-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .img-modal.active { display: flex; animation: softFadeIn 0.2s ease; }
    .img-modal img { max-width: 95%; max-height: 90vh; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">🌱 独中理科自主学习系统</div>
    <div class="header-actions">
      <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊 音效：开</button>
      <div class="breadcrumbs" id="breadcrumbNav">
        <span class="breadcrumb-item active" onclick="navigateHome()">学科选择</span>
      </div>
    </div>
  </header>

  <!-- 视图 1: 学科主页 -->
  <div id="viewSubjects" class="view active">
    <h2 style="font-size: 22px; font-weight: 800; color: #1e293b;">选择学习学科</h2>
    <p style="color: var(--text-muted); margin-top: 4px; font-size: 14px;">请选择董总华文独中高中统考科目：</p>
    <div class="grid-subjects">
      <div class="subject-card" onclick="openSubject('biology')">
        <div class="subject-icon">🌿</div>
        <div class="subject-title">生物 (Biology)</div>
        <div class="subject-desc">光合呼吸、神经调节、生殖发育与遗传育种</div>
      </div>
      <div class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
        <div class="subject-icon">🧪</div>
        <div class="subject-title">化学 (Chemistry)</div>
        <div class="subject-desc">整理中</div>
      </div>
      <div class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
        <div class="subject-icon">⚡</div>
        <div class="subject-title">物理 (Physics)</div>
        <div class="subject-desc">整理中</div>
      </div>
      <div class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
        <div class="subject-icon">📐</div>
        <div class="subject-title">高级数学 (Adv. Maths)</div>
        <div class="subject-desc">整理中</div>
      </div>
    </div>
  </div>

  <!-- 视图 2: 题目练习区 -->
  <div id="viewStudy" class="view">
    <div class="chapter-bookmark-rail" id="chapterRail"></div>
    <div class="sub-bookmark-bar">
      <button class="sub-tab-btn active" id="subBtnMcq" onclick="switchSubSection('mcq')">🎴 选择题练习</button>
      <button class="sub-tab-btn" id="subBtnSubj" onclick="switchSubSection('subj')">📝 综合做答题（背书闪卡）</button>
    </div>
    <div id="activeStudyArea"></div>
  </div>
</div>

<div class="img-modal" id="imgModal" onclick="closeImageModal()">
  <img id="modalImg" src="" alt="放大考题图">
</div>

<script>
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').innerText = soundEnabled ? '🔊 音效：开' : '🔇 音效：关';
    if (soundEnabled) playSound('pop');
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      if (type === 'pop') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.07);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.07);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.07);
      } else if (type === 'correct') {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t + i * 0.06);
          gain.gain.setValueAtTime(0, t + i * 0.06);
          gain.gain.linearRampToValueAtTime(0.18, t + i * 0.06 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t + i * 0.06);
          osc.stop(t + i * 0.06 + 0.3);
        });
      } else if (type === 'wrong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.linearRampToValueAtTime(190, t + 0.16);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      } else if (type === 'flip') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(340, t);
        osc.frequency.exponentialRampToValueAtTime(620, t + 0.05);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      }
    } catch (e) {}
  }

  // 19 章默认数据架构
  const DEFAULT_DATABASE = {
    "sections": [
      { "id": "chap1", "title": "第1章：生物是由什么组成的", "mcqs": [], "subjectives": [] },
      { "id": "chap2", "title": "第2章：细胞的结构与功能", "mcqs": [], "subjectives": [] },
      { "id": "chap3", "title": "第3章：细胞内物质和能量的转换", "mcqs": [], "subjectives": [] },
      { "id": "chap4", "title": "第4章：细胞分化", "mcqs": [], "subjectives": [] },
      { "id": "chap5", "title": "第5章：食物的消化与物质代谢", "mcqs": [], "subjectives": [] },
      { "id": "chap6", "title": "第6章：营养成分的运输", "mcqs": [], "subjectives": [] },
      { "id": "chap7", "title": "第7章：动植物的协调与反应", "mcqs": [], "subjectives": [] },
      { "id": "chap8", "title": "第8章：内环境的恒定和排泄系统", "mcqs": [], "subjectives": [] },
      { "id": "chap9", "title": "第9章：健康与免疫", "mcqs": [], "subjectives": [] },
      { "id": "chap10", "title": "第10章：生态系统", "mcqs": [], "subjectives": [] },
      { "id": "chap11", "title": "第11章：生态保育与可持续发展", "mcqs": [], "subjectives": [] },
      { "id": "chap12", "title": "第12章：生殖", "mcqs": [], "subjectives": [] },
      { "id": "chap13", "title": "第13章：细胞分裂", "mcqs": [], "subjectives": [] },
      { "id": "chap14", "title": "第14章：遗传的物质基础", "mcqs": [], "subjectives": [] },
      { "id": "chap15", "title": "第15章：基因与遗传的定律", "mcqs": [], "subjectives": [] },
      { "id": "chap16", "title": "第16章：应用遗传学", "mcqs": [], "subjectives": [] },
      { "id": "chap17", "title": "第17章：生物多样性", "mcqs": [], "subjectives": [] },
      { "id": "chap18", "title": "第18章：细菌与病毒", "mcqs": [], "subjectives": [] },
      { "id": "chap19", "title": "第19章：演化", "mcqs": [], "subjectives": [] }
    ]
  };

  let fullDatabase = DEFAULT_DATABASE;
  let activeChapterIdx = 0;
  let activeSubMode = 'mcq';
  let currentMcqIdx = 0;
  let currentColor = 'yellow';
  const HL_STORAGE_KEY = 'UEC_BIO_HL_STORE_OFFICIAL_19';

  function navigateHome() {
    playSound('flip');
    showView('viewSubjects');
    document.getElementById('breadcrumbNav').innerHTML = `<span class="breadcrumb-item active" onclick="navigateHome()">学科选择</span>`;
  }

  function openSubject(subject) {
    if (subject === 'biology') {
      playSound('pop');
      showView('viewStudy');
      document.getElementById('breadcrumbNav').innerHTML = `
        <span class="breadcrumb-item" onclick="navigateHome()">学科选择</span> &gt;
        <span class="breadcrumb-item active">生物科</span>
      `;
      renderChapterRail();
      renderActiveContent();
    }
  }

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

   // 智能多路径读取与自愈加载器
  async function loadData() {
    // 依次尝试：1. 子目录路径  2. 相对子目录路径  3. 根目录备用路径
    const candidatePaths = [
      '/papers/biology_question_bank.json',
      'papers/biology_question_bank.json',
      './biology_question_bank.json'
    ];

    let loaded = false;
    let lastError = '';

    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) {
          const data = await res.json();
          
          // 结构自适应：无论 JSON 是 sections 还是 mcq_sections，均自动统一
          if (data && (data.sections || data.mcq_sections)) {
            if (data.sections) {
              fullDatabase = data;
            } else {
              fullDatabase = {
                sections: data.mcq_sections.map((m, i) => ({
                  id: 'chap' + (i + 1),
                  title: m.title,
                  mcqs: m.mcqs || [],
                  subjectives: []
                }))
              };
            }
            loaded = true;
            console.log('✅ 成功从路径载入题库:', path);
            break;
          }
        } else {
          lastError = `HTTP ${res.status}: 无法找到 ${path}`;
        }
      } catch (err) {
        lastError = `JSON解析失败或网络异常: ${err.message}`;
      }
    }

    if (!loaded) {
      console.warn('⚠️ 题库载入失败，原因:', lastError);
      // 若加载失败，在控制台和主界面给予清晰红字提示，告别无声白屏
      const area = document.getElementById('activeStudyArea');
      if (area) {
        area.innerHTML = `
          <div style="background:#fef2f2; border:1px solid #f87171; color:#991b1b; padding:18px; border-radius:12px; margin-top:20px;">
            <strong>⚠️ 题库读取失败提示：</strong><br>
            系统尝试了 <code>/papers/biology_question_bank.json</code> 等路径均未成功。<br>
            <strong>错误信息：</strong> ${lastError}<br><br>
            <small>请排查：<br>
            1. GitHub 上的 <code>papers</code> 文件夹大小写（是否大写了 P）；<br>
            2. JSON 文件内是否有多余逗号导致的语法错误。</small>
          </div>
        `;
      }
    }
  }


  function renderChapterRail() {
    const rail = document.getElementById('chapterRail');
    rail.innerHTML = '';
    const sections = fullDatabase.sections || [];
    
    sections.forEach((sec, idx) => {
      const card = document.createElement('div');
      card.className = `chapter-card ${activeChapterIdx === idx ? 'active' : ''}`;
      card.onclick = () => selectChapter(idx);
      
      const match = sec.title.match(/第[一二三四五六七八九十0-9]+[章节]/);
      const tagText = match ? match[0] : `第 ${idx + 1} 章`;
      const nameText = sec.title.replace(/第.*[章节][：:]?/, '');

      card.innerHTML = `
        <span class="chap-badge">${tagText}</span>
        <div class="chap-name">${nameText}</div>
        <span class="chap-count">${sec.mcqs ? sec.mcqs.length : 0} 道题</span>
      `;
      rail.appendChild(card);
    });
  }

  function selectChapter(idx) {
    playSound('flip');
    activeChapterIdx = idx;
    currentMcqIdx = 0;
    renderChapterRail();
    renderActiveContent();
  }

  function switchSubSection(mode) {
    playSound('flip');
    activeSubMode = mode;
    document.getElementById('subBtnMcq').classList.toggle('active', mode === 'mcq');
    document.getElementById('subBtnSubj').classList.toggle('active', mode === 'subj');
    renderActiveContent();
  }

  function renderActiveContent() {
    const area = document.getElementById('activeStudyArea');
    area.innerHTML = '';
    const sec = (fullDatabase.sections || [])[activeChapterIdx];

    if (!sec) {
      area.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">暂无此章节数据。</div>`;
      return;
    }

    if (activeSubMode === 'mcq') {
      if (!sec.mcqs || sec.mcqs.length === 0) {
        area.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">本章节暂无选择题数据。</div>`;
        return;
      }
      const item = sec.mcqs[currentMcqIdx];

      let figureHtml = '';
      if (item.image) {
        figureHtml = `
          <div class="figure-container" onclick="openImageModal('${item.image}')">
            <img src="${item.image}" alt="考题高清图">
            <div class="figure-caption">🔍 点击查看高清大图</div>
          </div>`;
      } else if (item.figure) {
        figureHtml = `
          <div class="figure-container">
            ${item.figure}
            ${item.caption ? `<div class="figure-caption">${item.caption}</div>` : ''}
          </div>`;
      }

      area.innerHTML = `
        <div class="flashcard">
          <div class="mcq-question">${item.q}</div>
          ${figureHtml}
          <div class="mcq-options" id="optContainer"></div>
          <div class="explanation" id="expContainer">${item.explanation}</div>
          <div class="card-footer">
            <button class="btn-nav" onclick="navMcq(-1)">⬅️ 上一题</button>
            <span style="font-size:12px; color:var(--text-muted); font-weight:600;">第 ${currentMcqIdx + 1} / ${sec.mcqs.length} 题</span>
            <button class="btn-nav" onclick="navMcq(1)">下一题 ➡️</button>
          </div>
        </div>
      `;

      const optBox = document.getElementById('optContainer');
      const expBox = document.getElementById('expContainer');
      let isSolved = false;

      item.options.forEach((opt, oIdx) => {
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (isSolved) return;

          if (oIdx === item.answer) {
            isSolved = true;
            playSound('correct');
            btn.classList.add('correct');
            expBox.style.display = 'block';
            optBox.querySelectorAll('.option-btn').forEach(b => b.classList.add('locked'));
          } else {
            playSound('wrong');
            btn.classList.add('wrong');
          }
        };
        optBox.appendChild(btn);
      });

    } else {
      const subjs = sec.subjectives || [];
      if (subjs.length === 0) {
        area.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">本章节暂无做答题数据。</div>`;
        return;
      }
      let cardsHtml = '';

      subjs.forEach((q, qIndex) => {
        cardsHtml += `
          <div class="form-question-card">
            <div class="form-card-top-bar"></div>
            <div class="form-card-body">
              <div class="form-question-text">${q.question}</div>
              <div class="answer-flip-panel">
                <div class="flip-toggle-header" onclick="toggleAnswerFlip(this)">
                  <span class="flip-toggle-title">📖 参考标准答案与要点</span>
                  <span class="flip-status-pill">点击展开 / 遮挡默背</span>
                </div>
                <div class="flip-answer-content" id="${q.id || 'subj_' + qIndex}">
                  ${q.answer}
                </div>
              </div>
            </div>
          </div>
        `;
      });

      area.innerHTML = `
        <div class="hl-toolbar">
          <span style="font-size: 13px; font-weight: 700;">荧光标色：</span>
          <div class="hl-color-btn selected" style="background: var(--hl-yellow);" onclick="setColor('yellow', this)"></div>
          <div class="hl-color-btn" style="background: var(--hl-green);" onclick="setColor('green', this)"></div>
          <div class="hl-color-btn" style="background: var(--hl-pink);" onclick="setColor('pink', this)"></div>
          <button class="hl-btn-action" onclick="applyHighlight()">✏️ 划线高亮</button>
          <button class="hl-btn-action" onclick="clearHighlights()">🗑️ 清除所有</button>
          <span class="status-toast" id="saveToast">自动保存已开启</span>
        </div>
        <div class="form-style-container" id="subjFormContainer">${cardsHtml}</div>
      `;
      loadAllHighlights();
    }
  }

  function navMcq(delta) {
    const sec = (fullDatabase.sections || [])[activeChapterIdx];
    const newIdx = currentMcqIdx + delta;
    if (newIdx >= 0 && newIdx < sec.mcqs.length) {
      playSound('flip');
      currentMcqIdx = newIdx;
      renderActiveContent();
    }
  }

  function toggleAnswerFlip(headerEl) {
    playSound('pop');
    const content = headerEl.nextElementSibling;
    const isShown = content.classList.toggle('revealed');
    headerEl.querySelector('.flip-status-pill').innerText = isShown ? '🙈 点击遮盖默背' : '📖 点击展开答案';
  }

  function setColor(color, el) {
    playSound('pop');
    currentColor = color;
    document.querySelectorAll('.hl-color-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
  }

  function applyHighlight() {
    const selection = window.getSelection();
    if (!selection.rangeCount || selection.isCollapsed) return;
    const range = selection.getRangeAt(0);
    const container = document.getElementById('subjFormContainer');
    if (!container.contains(range.commonAncestorContainer)) return;
    const span = document.createElement('span');
    span.className = `hl-mark-${currentColor}`;
    try {
      range.surroundContents(span);
      playSound('pop');
      localStorage.setItem(HL_STORAGE_KEY, container.innerHTML);
    } catch (e) {
      alert("请选取同一段落中的文字划线。");
    }
    selection.removeAllRanges();
  }

  function loadAllHighlights() {
    const saved = localStorage.getItem(HL_STORAGE_KEY);
    const container = document.getElementById('subjFormContainer');
    if (saved && container) container.innerHTML = saved;
  }

  function clearHighlights() {
    playSound('wrong');
    const container = document.getElementById('subjFormContainer');
    const marks = container.querySelectorAll('[class^="hl-mark-"]');
    marks.forEach(m => {
      const parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
    });
    localStorage.setItem(HL_STORAGE_KEY, container.innerHTML);
  }

  function openImageModal(src) {
    playSound('pop');
    document.getElementById('modalImg').src = src;
    document.getElementById('imgModal').classList.add('active');
  }
  function closeImageModal() {
    document.getElementById('imgModal').classList.remove('active');
  }

  window.onload = async () => {
    await loadData();
  };
</script>
</body>
</html>
