<!DOCTYPE html>
<html lang="zh-MY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独中理科自主学习系统 · 生物科</title>
  <style>
    :root {
      --primary: #059669;
      --primary-light: #ecfdf5;
      --primary-border: #a7f3d0;
      --bg-nature: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #f7fee7 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(226, 232, 240, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --hl-yellow: #fef08a;
      --hl-green: #bbf7d0;
      --hl-pink: #fbcfe8;
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 24px -6px rgba(5, 150, 105, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-nature);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* 顶部导航与音效开关 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
    }
    .brand { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .sound-toggle {
      background: #fff;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .sound-toggle:hover { border-color: var(--primary); transform: translateY(-1px); }

    .breadcrumbs { font-size: 13px; color: var(--text-muted); }
    .breadcrumb-item { cursor: pointer; transition: color 0.2s; }
    .breadcrumb-item:hover { color: var(--primary); text-decoration: underline; }
    .breadcrumb-item.active { color: var(--text-main); font-weight: 700; cursor: default; text-decoration: none; }

    /* 视图切换 */
    .view { display: none; }
    .view.active { display: block; animation: softFadeIn 0.25s ease; }
    @keyframes softFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* 主学科网格 */
    .grid-subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 16px; }
    .subject-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 18px;
      cursor: pointer;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .subject-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: var(--shadow-md); background: #fff; }
    .subject-icon { font-size: 40px; margin-bottom: 8px; }
    .subject-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .subject-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    /* 📑 PPT 动态竖型书签轨道 */
    .bookmark-rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 6px 4px 18px 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .bookmark-rail::-webkit-scrollbar { display: none; }

    .bookmark-card {
      flex: 0 0 115px;
      height: 130px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .bookmark-card:hover { transform: translateY(-3px); border-color: var(--primary); background: #fff; }
    
    .bookmark-card.active {
      background: #ffffff;
      border-color: var(--primary);
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-width: 2px;
    }
    .bookmark-card.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      width: 14px;
      height: 4px;
      background: var(--primary);
      border-radius: 4px;
    }

    .bm-tag { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 2px 6px; border-radius: 8px; }
    .bm-name { font-size: 13px; font-weight: 700; color: #1e293b; text-align: center; line-height: 1.35; margin: 4px 0; }
    .bm-count { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    /* 小节标题条 */
    .section-header {
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .section-title { font-size: 17px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 6px; }
    .section-count { font-size: 12px; color: var(--primary); font-weight: 700; background: var(--primary-light); padding: 2px 8px; border-radius: 10px; }

    /* 闪卡练习区 */
    .flashcard {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .mcq-question { font-size: 16px; font-weight: 600; line-height: 1.7; margin-bottom: 16px; white-space: pre-line; color: #1e293b; }

    /* 📷 高清原图容器 */
    .figure-container {
      margin: 12px 0 18px 0;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: zoom-in;
    }
    .figure-container img {
      max-width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      transition: transform 0.2s;
    }
    .figure-container img:hover { transform: scale(1.02); }
    .figure-caption { font-size: 12px; color: var(--accent); margin-top: 8px; font-weight: 600; }

    /* 选项 */
    .mcq-options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      color: #334155;
      text-align: left;
      padding: 13px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.5;
      transition: all 0.2s;
    }
    .option-btn:hover:not(.disabled) { border-color: var(--primary); background: #f0fdf4; transform: translateX(3px); }
    .option-btn.correct { background: #ecfdf5; border-color: var(--success); color: #065f46; font-weight: 700; }
    .option-btn.wrong { background: #fef2f2; border-color: var(--danger); color: #991b1b; }
    
    .explanation {
      margin-top: 16px;
      padding: 14px 16px;
      background: #f0fdf4;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: #166534;
      border-left: 4px solid var(--primary);
      display: none;
    }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(226, 232, 240, 0.8); }
    .btn-nav { background: #fff; border: 1px solid #cbd5e1; color: #334155; padding: 7px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-nav:hover { border-color: var(--primary); color: var(--primary); }

    /* 划线工具条与主观题 */
    .hl-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .hl-color-btn { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .hl-color-btn.selected { border-color: #0f172a; transform: scale(1.18); }
    .hl-btn-action { background: #fff; border: 1px solid #cbd5e1; color: #334155; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    
    .subjective-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .subjective-question { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 12px; line-height: 1.7; white-space: pre-line; }
    .subjective-answer { background: #f8fafc; padding: 16px; border-radius: 10px; border: 1.5px dashed #cbd5e1; font-size: 14px; line-height: 1.8; color: #334155; }
    .hl-mark-yellow { background-color: var(--hl-yellow); color: #854d0e; padding: 2px 4px; border-radius: 3px; font-weight: 500; }
    .hl-mark-green { background-color: var(--hl-green); color: #166534; padding: 2px 4px; border-radius: 3px; font-weight: 500; }
    .hl-mark-pink { background-color: var(--hl-pink); color: #9d174d; padding: 2px 4px; border-radius: 3px; font-weight: 500; }
    .status-toast { font-size: 12px; color: var(--primary); font-weight: 600; margin-left: auto; }

    /* 🔍 全屏图片放大预览模态窗 */
    .img-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .img-modal.active { display: flex; animation: softFadeIn 0.2s ease; }
    .img-modal img { max-width: 95%; max-height: 90vh; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">🌱 独中理科自主学习系统</div>
    <div class="header-actions">
      <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊 音效：开</button>
      <div class="breadcrumbs" id="breadcrumbNav">
        <span class="breadcrumb-item active" onclick="navigateHome()">学科选择</span>
      </div>
    </div>
  </header>

  <!-- 视图 1: 学科选择列表 -->
  <div id="viewSubjects" class="view active">
    <h2 style="font-size: 22px; font-weight: 800; color: #1e293b;">选择学习学科</h2>
    <p style="color: var(--text-muted); margin-top: 4px; font-size: 14px;">请选择董总华文独中高中统考科目：</p>
    <div class="grid-subjects">
      <div class="subject-card" onclick="openSubject('biology')">
        <div class="subject-icon">🌿</div>
        <div class="subject-title">生物 (Biology)</div>
        <div class="subject-desc">光合代谢、神经反射、生殖发育与分子遗传</div>
      </div>
      <div class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
        <div class="subject-icon">🧪</div>
        <div class="subject-title">化学 (Chemistry)</div>
        <div class="subject-desc">整理中</div>
      </div>
      <div class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
        <div class="subject-icon">⚡</div>
        <div class="subject-title">物理 (Physics)</div>
        <div class="subject-desc">整理中</div>
      </div>
      <div class="subject-card" style="opacity: 0.6; cursor: not-allowed;">
        <div class="subject-icon">📐</div>
        <div class="subject-title">高级数学 (Adv. Maths)</div>
        <div class="subject-desc">整理中</div>
      </div>
    </div>
  </div>

  <!-- 视图 2: 题目练习区 (PPT 竖型书签导航) -->
  <div id="viewStudy" class="view">
    <!-- 📑 PPT 动态竖型书签轨道 -->
    <div class="bookmark-rail" id="bookmarkRail"></div>

    <!-- 练习内容区域 -->
    <div id="sectionContentArea"></div>
  </div>
</div>

<!-- 图片放大灯箱 -->
<div class="img-modal" id="imgModal" onclick="closeImageModal()">
  <img id="modalImg" src="" alt="放大考题图">
</div>

<script>
  // 🎵 Web Audio 原生音效引擎
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').innerText = soundEnabled ? '🔊 音效：开' : '🔇 音效：关';
    if (soundEnabled) playSound('pop');
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      if (type === 'pop') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(450, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.07);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.07);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.07);
      } else if (type === 'correct') {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t + i * 0.06);
          gain.gain.setValueAtTime(0, t + i * 0.06);
          gain.gain.linearRampToValueAtTime(0.18, t + i * 0.06 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t + i * 0.06);
          osc.stop(t + i * 0.06 + 0.3);
        });
      } else if (type === 'wrong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.linearRampToValueAtTime(190, t + 0.16);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      } else if (type === 'flip') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(340, t);
        osc.frequency.exponentialRampToValueAtTime(620, t + 0.05);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      }
    } catch (e) {}
  }

  // 兜底数据库
  const DEFAULT_DATABASE = {
    "mcq_sections": [
      {
        "title": "第一节：光合作用与环境因素",
        "mcqs": [
          {
            "q": "下图所示曲线显示在不同温度和二氧化碳浓度下，光强度对光合速率的影响。\n通过比较哪两条曲线可看出二氧化碳浓度会影响光合速率？\n\nI  P 和 Q\nII P 和 R\nIII Q 和 S\nIV R 和 S",
            "figure": "<svg viewBox='0 0 400 240' width='100%' style='max-width:380px;' xmlns='http://www.w3.org/2000/svg'><line x1='50' y1='200' x2='380' y2='200' stroke='#64748b' stroke-width='2'/><line x1='50' y1='200' x2='50' y2='20' stroke='#64748b' stroke-width='2'/><text x='330' y='225' fill='#64748b' font-size='13'>光强度</text><text x='25' y='110' fill='#64748b' font-size='13' writing-mode='vertical-rl'>光合速率</text><path d='M 50 200 Q 180 50 350 40' fill='none' stroke='#0284c7' stroke-width='2.5'/><text x='355' y='44' fill='#0284c7' font-size='14' font-weight='bold'>P</text><path d='M 50 200 Q 180 90 350 85' fill='none' stroke='#059669' stroke-width='2.5'/><text x='355' y='89' fill='#059669' font-size='14' font-weight='bold'>Q</text><path d='M 50 200 Q 180 125 350 120' fill='none' stroke='#d97706' stroke-width='2.5'/><text x='355' y='124' fill='#d97706' font-size='14' font-weight='bold'>R</text><path d='M 50 200 Q 180 155 350 150' fill='none' stroke='#e11d48' stroke-width='2.5'/><text x='355' y='154' fill='#e11d48' font-size='14' font-weight='bold'>S</text></svg>",
            "caption": "图：不同温度与 CO₂ 浓度下的光合速率曲线",
            "options": ["A. I, II", "B. I, IV", "C. II, III", "D. III, IV"],
            "answer": 2,
            "explanation": "【解析】：探究单一变量（CO₂ 浓度）影响时须严格控制温度相同：30°C 下比较 P 与 R (II)；20°C 下比较 Q 与 S (III)。因此选 C。"
          }
        ]
      },
      {
        "title": "第二节：神经调节与反射弧结构",
        "mcqs": [
          {
            "q": "“渐冻症”（Amyotrophic Lateral Sclerosis）是一种因运动神经元退化导致骨骼肌随意运动丧失的疾病，感觉能力依然正常。在脊髓横切结构中，哪一部位能找到该受损神经纤维？",
            "figure": "<svg viewBox='0 0 460 220' width='100%' style='max-width:400px;' xmlns='http://www.w3.org/2000/svg'><path d='M 60 110 C 60 60, 160 30, 230 50 C 300 30, 400 60, 400 110 C 400 160, 290 180, 230 180 C 170 180, 60 160, 60 110 Z' fill='#f1f5f9' stroke='#94a3b8' stroke-width='2'/><path d='M 170 80 C 190 80, 200 95, 230 95 C 260 95, 270 80, 290 80 C 310 80, 325 110, 310 145 C 290 145, 270 125, 230 125 C 190 125, 170 145, 150 145 C 135 110, 150 80, 170 80 Z' fill='#cbd5e1' stroke='#0284c7' stroke-width='2'/><text x='140' y='35' fill='#0f172a' font-size='14' font-weight='bold'>A (灰质)</text><text x='230' y='20' fill='#0f172a' font-size='14' font-weight='bold' text-anchor='middle'>B (白质)</text><text x='380' y='40' fill='#0f172a' font-size='14' font-weight='bold'>C (背根/感觉)</text><text x='420' y='200' fill='#0f172a' font-size='14' font-weight='bold' text-anchor='middle'>D (腹根/运动)</text></svg>",
            "caption": "图：脊髓横切面及神经根结构",
            "options": ["A. A", "B. B", "C. C", "D. D"],
            "answer": 3,
            "explanation": "【解析】：渐冻症是运动神经元受损。在脊髓中，D 为腹根（前根），内含传出神经纤维（运动神经），直接由脊髓灰质前角发出支配骨骼肌。"
          }
        ]
      }
    ],
    "subjective_sections": [
      {
        "title": "综合实验作答题",
        "questions": [
          {
            "id": "subj_1",
            "question": "下图是人体的消化系统结构示意图，请回答：\n(1) 脂肪、蛋白质、淀粉分别在哪个部位开始被消化？\n(2) 写出小肠有利于吸收营养的三个特征。",
            "answer": "<strong>【参考标准答案与得分点】：</strong><br><br>1. 消化起始部位：脂肪在<span class=\"hl-mark-yellow\">小肠</span>、蛋白质在<span class=\"hl-mark-yellow\">胃</span>、淀粉在<span class=\"hl-mark-yellow\">口腔</span>。<br>2. 小肠吸收特征：<span class=\"hl-mark-green\">长达5~6米吸收充分</span>；<span class=\"hl-mark-yellow\">有环形皱襞与绒毛极大增加吸收面积</span>；<span class=\"hl-mark-pink\">绒毛壁仅由一层上皮细胞构成</span>。"
          }
        ]
      }
    ]
  };

  let fullDatabase = DEFAULT_DATABASE;
  let activeSectionType = 'mcq';
  let activeSectionIdx = 0;
  let currentMcqIdx = 0;
  let currentColor = 'yellow';
  const HL_STORAGE_KEY = 'UEC_BIO_HL_STORE_V7';

  function navigateHome() {
    playSound('flip');
    showView('viewSubjects');
    document.getElementById('breadcrumbNav').innerHTML = `<span class="breadcrumb-item active" onclick="navigateHome()">学科选择</span>`;
  }

  function openSubject(subject) {
    if (subject === 'biology') {
      playSound('pop');
      showView('viewStudy');
      document.getElementById('breadcrumbNav').innerHTML = `
        <span class="breadcrumb-item" onclick="navigateHome()">学科选择</span> &gt;
        <span class="breadcrumb-item active">生物科</span>
      `;
      renderBookmarks();
      renderActiveSection();
    }
  }

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  async function loadData() {
    try {
      const res = await fetch('./biology_question_bank.json');
      if (res.ok) {
        const data = await res.json();
        if (data && (data.mcq_sections || data.sections)) {
          fullDatabase = data.mcq_sections ? data : { mcq_sections: data.sections, subjective_sections: data.subjective_sections || [] };
        }
      }
    } catch (e) {}
  }

  // 📑 渲染 PPT 竖型书签导航条
  function renderBookmarks() {
    const rail = document.getElementById('bookmarkRail');
    rail.innerHTML = '';

    // MCQ 小节书签
  (fullDatabase.mcq_sections || []).forEach((sec, idx) => {
      const card = document.createElement('div');
      card.className = `bookmark-card ${activeSectionType === 'mcq' && activeSectionIdx === idx ? 'active' : ''}`;
      card.onclick = () => selectBookmark('mcq', idx);
      card.innerHTML = `
        <span class="bm-tag">🔖 第 ${idx + 1} 节</span>
        <div class="bm-name">${sec.title.replace(/第.*节[：:]/, '')}</div>
        <span class="bm-count">${sec.mcqs.length} 题</span>
      `;
      rail.appendChild(card);
    });

    // 主观作答题书签
    if ((fullDatabase.subjective_sections || []).length > 0) {
      const subjCard = document.createElement('div');
      subjCard.className = `bookmark-card ${activeSectionType === 'subj' ? 'active' : ''}`;
      subjCard.onclick = () => selectBookmark('subj', 0);
      subjCard.innerHTML = `
        <span class="bm-tag" style="background: #fef08a; color: #854d0e;">📝 综合题</span>
        <div class="bm-name">实验作答题</div>
        <span class="bm-count">重点划线</span>
      `;
      rail.appendChild(subjCard);
    }
  }
 function selectBookmark(type, idx) {
    playSound('flip');
    activeSectionType = type;
    activeSectionIdx = idx;
    currentMcqIdx = 0;
    renderBookmarks();
    renderActiveSection();
  }


  // 渲染当前选中小节的内容面板
  function renderActiveSection() {
    const area = document.getElementById('sectionContentArea');
    area.innerHTML = '';

    if (activeSectionType === 'mcq') {
      const sec = fullDatabase.mcq_sections[activeSectionIdx];
      if (!sec) return;
      const item = sec.mcqs[currentMcqIdx];

      // 处理配图：支持 image (本地高清照片) 或 figure (SVG)
      let figureHtml = '';
      if (item.image) {
        figureHtml = `
          <div class="figure-container" onclick="openImageModal('${item.image}')">
            <img src="${item.image}" alt="考题高清图">
            <div class="figure-caption">🔍 点击查看原图高清放大版</div>
          </div>
        `;
      } else if (item.figure) {
        figureHtml = `
          <div class="figure-container">
            ${item.figure}
            ${item.caption ? `<div class="figure-caption">${item.caption}</div>` : ''}
          </div>
        `;
      }

      area.innerHTML = `
        <div class="section-header">
          <div class="section-title">📌 ${sec.title}</div>
          <div class="section-count">第 ${currentMcqIdx + 1} / ${sec.mcqs.length} 题</div>

        </div>

        <div class="flashcard">

          <div class="mcq-question">${item.q}</div>

          ${figureHtml}

          <div class="mcq-options" id="activeOptBox"></div>

          <div class="explanation" id="activeExpBox">${item.explanation}</div>

          <div class="card-footer">

            <button class="btn-nav" onclick="navCurrentMcq(-1)">⬅️ 上一题</button>

            <button class="btn-nav" onclick="navCurrentMcq(1)">下一题 ➡️</button>

          </div>

        </div>

      `;



      const optBox = document.getElementById('activeOptBox');

      const expBox = document.getElementById('activeExpBox');



      item.options.forEach((opt, oIdx) => {

        const btn = document.createElement('div');

        btn.className = 'option-btn';

        btn.innerText = opt;

        btn.onclick = () => {

          const isRight = (oIdx === item.answer);

          playSound(isRight ? 'correct' : 'wrong');

          optBox.querySelectorAll('.option-btn').forEach((b, i) => {

            b.classList.add('disabled');

            if (i === item.answer) b.classList.add('correct');

            if (i === oIdx && oIdx !== item.answer) b.classList.add('wrong');

          });

          expBox.style.display = 'block';

        };

        optBox.appendChild(btn);

      });

    } else {

      // 主观题划线视图

      let questionsHtml = '';

      (fullDatabase.subjective_sections || []).forEach(sec => {

        sec.questions.forEach(q => {

          questionsHtml += `

            <div class="subjective-box">

              <div class="subjective-question">${q.question}</div>

              <div class="subjective-answer" id="${q.id}">${q.answer}</div>

            </div>

          `;

        });

      });



      area.innerHTML = `

        <div class="hl-toolbar">

          <span style="font-size: 13px; font-weight: 600;">荧光笔：</span>

          <div class="hl-color-btn selected" style="background: var(--hl-yellow);" onclick="setColor('yellow', this)"></div>

          <div class="hl-color-btn" style="background: var(--hl-green);" onclick="setColor('green', this)"></div>

          <div class="hl-color-btn" style="background: var(--hl-pink);" onclick="setColor('pink', this)"></div>

          <button class="hl-btn-action" onclick="applyHighlight()">✏️ 划线高亮</button>

          <button class="hl-btn-action" onclick="clearHighlights()">🗑️ 清除所有</button>

          <span class="status-toast" id="saveToast">自动保存已开启</span>

        </div>

        <div id="subjContainer">${questionsHtml}</div>

      `;

      loadAllHighlights();

    }

  }



  function navCurrentMcq(delta) {

    const sec = fullDatabase.mcq_sections[activeSectionIdx];

    const newIdx = currentMcqIdx + delta;

    if (newIdx >= 0 && newIdx < sec.mcqs.length) {

      playSound('flip');

      currentMcqIdx = newIdx;

      renderActiveSection();

    }

  }



  // 划线高亮逻辑

  function setColor(color, el) {

    playSound('pop');

    currentColor = color;

    document.querySelectorAll('.hl-color-btn').forEach(b => b.classList.remove('selected'));

    el.classList.add('selected');

  }



  function applyHighlight() {

    const selection = window.getSelection();

    if (!selection.rangeCount || selection.isCollapsed) return;

    const range = selection.getRangeAt(0);

    const container = document.getElementById('subjContainer');

    if (!container.contains(range.commonAncestorContainer)) return;

    const span = document.createElement('span');

    span.className = `hl-mark-${currentColor}`;

    try {

      range.surroundContents(span);

      playSound('pop');

      localStorage.setItem(HL_STORAGE_KEY, container.innerHTML);

    } catch (e) {

      alert("请选取同一段落中的文字划线。");

    }

    selection.removeAllRanges();

  }



  function loadAllHighlights() {

    const saved = localStorage.getItem(HL_STORAGE_KEY);

    const container = document.getElementById('subjContainer');

    if (saved && container) container.innerHTML = saved;

  }



  function clearHighlights() {

    playSound('wrong');

    const container = document.getElementById('subjContainer');

    const marks = container.querySelectorAll('[class^="hl-mark-"]');

    marks.forEach(m => {

      const parent = m.parentNode;

      while (m.firstChild) parent.insertBefore(m.firstChild, m);

      parent.removeChild(m);

    });

    localStorage.setItem(HL_STORAGE_KEY, container.innerHTML);

  }



  // 🔍 图片灯箱放大

  function openImageModal(src) {

    playSound('pop');

    document.getElementById('modalImg').src = src;

    document.getElementById('imgModal').classList.add('active');

  }

  function closeImageModal() {
 document.getElementById('imgModal').classList.remove('active');
  }
  window.onload = loadData;
</script>
</body>
</html>
