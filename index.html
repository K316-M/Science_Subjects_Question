<!DOCTYPE html>
<html lang="zh-MY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独中理科自主学习系统</title>
  <style>
    :root {
      --primary: #10b981;
      --bg-dark: #0b1120;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f43f5e;
      --hl-yellow: #fef08a;
      --hl-green: #bbf7d0;
      --hl-pink: #fbcfe8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 20px 14px; }
    .container { max-width: 900px; margin: 0 auto; }

    /* 顶部导航与面包屑 */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #334155; }
    .brand { font-size: 19px; font-weight: 700; color: var(--primary); }
    .breadcrumbs { font-size: 13px; color: var(--text-muted); }
    .breadcrumb-item { cursor: pointer; }
    .breadcrumb-item:hover { color: var(--accent); text-decoration: underline; }
    .breadcrumb-item.active { color: var(--text-main); font-weight: 600; cursor: default; text-decoration: none; }

    /* 视图切换 */
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* 学科网格卡片 */
    .grid-subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 16px; }
    .subject-card { background: var(--bg-card); border: 1px solid #334155; border-radius: 12px; padding: 20px; cursor: pointer; text-align: center; transition: 0.2s; }
    .subject-card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .subject-icon { font-size: 36px; margin-bottom: 8px; }
    .subject-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .subject-desc { font-size: 12px; color: var(--text-muted); }

    /* 模式切换 */
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .tab-btn { background: transparent; border: 1px solid #334155; color: var(--text-muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .tab-btn.active { background: var(--primary); color: #000; font-weight: 600; border-color: var(--primary); }

    /* 小节标题规范：标题 + 下底线 + 间距 */
    .section-block { margin-bottom: 30px; }
    .section-header { margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: flex-end; }
    .section-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .section-count { font-size: 12px; color: var(--accent); }

    /* 闪卡与选项 */
    .flashcard { background: var(--bg-card); border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .mcq-question { font-size: 15px; font-weight: 600; line-height: 1.6; margin-bottom: 14px; white-space: pre-line; }
    .figure-container { margin: 10px 0 16px 0; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; }
    .figure-caption { font-size: 11px; color: var(--accent); margin-top: 6px; }
    .mcq-options { display: flex; flex-direction: column; gap: 8px; }
    .option-btn { background: #0f172a; border: 1px solid #334155; color: var(--text-main); text-align: left; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .option-btn:hover:not(.disabled) { border-color: var(--accent); background: #1a2638; }
    .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--primary); color: #6ee7b7; font-weight: 600; }
    .option-btn.wrong { background: rgba(244, 63, 94, 0.2); border-color: var(--danger); color: #fda4af; }
    .explanation { margin-top: 14px; padding: 12px; background: #0f172a; border-radius: 6px; font-size: 13px; line-height: 1.6; border-left: 3px solid var(--accent); display: none; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid #334155; }
    .btn-nav { background: #334155; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    /* 主观题划线工具 */
    .hl-toolbar { display: flex; align-items: center; gap: 8px; background: #1e293b; padding: 8px 14px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 14px; flex-wrap: wrap; }
    .hl-color-btn { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .hl-color-btn.selected { border-color: #fff; transform: scale(1.15); }
    .hl-btn-action { background: #334155; border: none; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; }
    .subjective-box { background: var(--bg-card); border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-bottom: 20px; line-height: 1.7; }
    .subjective-question { font-size: 14px; font-weight: 600; margin-bottom: 12px; white-space: pre-line; }
    .subjective-answer { background: #0f172a; padding: 14px; border-radius: 6px; border: 1px dashed #334155; font-size: 13px; }
    .hl-mark-yellow { background-color: rgba(254, 240, 138, 0.4); color: #fef08a; padding: 1px 3px; border-radius: 3px; }
    .hl-mark-green { background-color: rgba(187, 247, 208, 0.4); color: #86efac; padding: 1px 3px; border-radius: 3px; }
    .hl-mark-pink { background-color: rgba(251, 207, 232, 0.4); color: #f472b6; padding: 1px 3px; border-radius: 3px; }
    .status-toast { font-size: 11px; color: var(--primary); margin-left: auto; }
  </style>
</head>
<body>

<div class="container">
  <!-- 顶部导航栏 -->
  <header>
    <div class="brand">🧬 独中理科学习系统</div>
    <div class="breadcrumbs" id="breadcrumbNav">
      <span class="breadcrumb-item active" onclick="navigateHome()">学科选择</span>
    </div>
  </header>

  <!-- 视图 1: 主学科选择列表 -->
  <div id="viewSubjects" class="view active">
    <h2>选择学习学科</h2>
    <p style="color: var(--text-muted); margin-top: 4px; font-size: 13px;">请选择董总高中统考理科科目：</p>
    <div class="grid-subjects">
      <div class="subject-card" onclick="openSubject('biology')">
        <div class="subject-icon">🌱</div>
        <div class="subject-title">生物 (Biology)</div>
        <div class="subject-desc">光合作用、神经系统、生殖发育与遗传</div>
      </div>
      <div class="subject-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="subject-icon">🧪</div>
        <div class="subject-title">化学 (Chemistry)</div>
        <div class="subject-desc">整理中</div>
      </div>
      <div class="subject-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="subject-icon">⚡</div>
        <div class="subject-title">物理 (Physics)</div>
        <div class="subject-desc">整理中</div>
      </div>
      <div class="subject-card" style="opacity: 0.5; cursor: not-allowed;">
        <div class="subject-icon">📐</div>
        <div class="subject-title">高级数学 (Adv. Maths)</div>
        <div class="subject-desc">整理中</div>
      </div>
    </div>
  </div>

  <!-- 视图 2: 题目练习区 -->
  <div id="viewStudy" class="view">
    <div class="mode-tabs">
      <button class="tab-btn active" id="tabMcq" onclick="switchMode('mcq')">🎴 选择题练习闪卡（分小节）</button>
      <button class="tab-btn" id="tabSubj" onclick="switchMode('subj')">🖍️ 重点划线主观题</button>
    </div>

    <!-- 选择题展示区 -->
    <div id="modeMcqArea">
      <div id="mcqSectionsContainer"></div>
    </div>

    <!-- 主观题展示区 -->
    <div id="modeSubjArea" style="display: none;">
      <div class="hl-toolbar">
        <span style="font-size: 12px;">划线颜色：</span>
        <div class="hl-color-btn selected" style="background: var(--hl-yellow);" onclick="setColor('yellow', this)"></div>
        <div class="hl-color-btn" style="background: var(--hl-green);" onclick="setColor('green', this)"></div>
        <div class="hl-color-btn" style="background: var(--hl-pink);" onclick="setColor('pink', this)"></div>
        <button class="hl-btn-action" onclick="applyHighlight()">✏️ 高亮选中文本</button>
        <button class="hl-btn-action" onclick="clearHighlights()">🗑️ 清除所有划线</button>
        <span class="status-toast" id="saveToast">划线状态已自动同步</span>
      </div>
      <div id="subjSectionsContainer"></div>
    </div>
  </div>
</div>

<script>
  // 兜底基础题库（确保即使未载入外部 JSON 也能正常使用）
  const DEFAULT_DATABASE = {
    "mcq_sections": [
      {
        "title": "第一节：光合作用与环境因素影响",
        "mcqs": [
          {
            "q": "下图所示曲线显示在不同温度和二氧化碳浓度下，光强度对光合速率的影响。\n通过比较哪两条曲线可看出二氧化碳浓度会影响光合速率？\n\nI  P 和 Q\nII P 和 R\nIII Q 和 S\nIV R 和 S",
            "figure": "<svg viewBox='0 0 400 240' width='100%' style='max-width:380px;' xmlns='http://www.w3.org/2000/svg'><line x1='50' y1='200' x2='380' y2='200' stroke='#94a3b8' stroke-width='2'/><line x1='50' y1='200' x2='50' y2='20' stroke='#94a3b8' stroke-width='2'/><polygon points='380,196 390,200 380,204' fill='#94a3b8'/><polygon points='46,20 50,10 54,20' fill='#94a3b8'/><text x='340' y='225' fill='#94a3b8' font-size='13'>光强度</text><text x='25' y='110' fill='#94a3b8' font-size='13' writing-mode='vertical-rl'>光合速率</text><path d='M 50 200 Q 180 50 350 40' fill='none' stroke='#38bdf8' stroke-width='2.5'/><text x='230' y='35' fill='#38bdf8' font-size='12'>30°C, 0.2% CO₂</text><text x='360' y='44' fill='#38bdf8' font-size='14' font-weight='bold'>P</text><path d='M 50 200 Q 180 90 350 85' fill='none' stroke='#10b981' stroke-width='2.5'/><text x='230' y='80' fill='#10b981' font-size='12'>20°C, 0.2% CO₂</text><text x='360' y='89' fill='#10b981' font-size='14' font-weight='bold'>Q</text><path d='M 50 200 Q 180 125 350 120' fill='none' stroke='#f59e0b' stroke-width='2.5'/><text x='230' y='115' fill='#f59e0b' font-size='12'>30°C, 0.1% CO₂</text><text x='360' y='124' fill='#f59e0b' font-size='14' font-weight='bold'>R</text><path d='M 50 200 Q 180 155 350 150' fill='none' stroke='#f43f5e' stroke-width='2.5'/><text x='230' y='145' fill='#f43f5e' font-size='12'>20°C, 0.1% CO₂</text><text x='360' y='154' fill='#f43f5e' font-size='14' font-weight='bold'>S</text></svg>",
            "caption": "图：不同温度与 CO₂ 浓度下的光合速率曲线",
            "options": ["A. I, II", "B. I, IV", "C. II, III", "D. III, IV"],
            "answer": 2,
            "explanation": "【解析】：探究单一变量（CO₂ 浓度）对光合速率的影响时，必须严格控制温度相同：\n1. 30°C 条件下：对比 P 与 R -> 对应组合 II\n2. 20°C 条件下：对比 Q 与 S -> 对应组合 III\n因此正确答案为 C (II, III)。"
          }
        ]
      },
      {
        "title": "第二节：神经调节与脊髓反射结构",
        "mcqs": [
          {
            "q": "“渐冻症”（Amyotrophic Lateral Sclerosis）是一种因神经元 X 退化或死亡而导致骨骼肌逐渐弱化的疾病。患者最终无法控制全身的随意运动，但仍保有正常的意识、智力与感觉能力。下图哪个部分能找到神经元 X？",
            "figure": "<svg viewBox='0 0 460 240' width='100%' style='max-width:420px;' xmlns='http://www.w3.org/2000/svg'><path d='M 60 120 C 60 70, 160 30, 230 50 C 300 30, 400 70, 400 120 C 400 170, 290 190, 230 190 C 170 190, 60 170, 60 120 Z' fill='#1e293b' stroke='#94a3b8' stroke-width='2'/><path d='M 170 85 C 190 85, 200 105, 230 105 C 260 105, 270 85, 290 85 C 310 85, 330 120, 310 155 C 290 155, 270 135, 230 135 C 190 135, 170 155, 150 155 C 130 120, 150 85, 170 85 Z' fill='#334155' stroke='#38bdf8' stroke-width='2'/><line x1='180' y1='95' x2='150' y2='40' stroke='#f8fafc' stroke-width='1.5'/><text x='140' y='35' fill='#f8fafc' font-size='15' font-weight='bold'>A (灰质)</text><line x1='230' y1='50' x2='230' y2='25' stroke='#f8fafc' stroke-width='1.5'/><text x='230' y='18' fill='#f8fafc' font-size='15' font-weight='bold' text-anchor='middle'>B (白质)</text><path d='M 400 100 Q 430 80 450 110' fill='none' stroke='#10b981' stroke-width='3'/><line x1='425' y1='90' x2='390' y2='45' stroke='#f8fafc' stroke-width='1.5'/><text x='385' y='40' fill='#f8fafc' font-size='15' font-weight='bold'>C (背根/感觉)</text><path d='M 400 140 Q 430 160 450 130' fill='none' stroke='#f43f5e' stroke-width='3'/><line x1='425' y1='150' x2='425' y2='200' stroke='#f8fafc' stroke-width='1.5'/><text x='425' y='220' fill='#f8fafc' font-size='15' font-weight='bold' text-anchor='middle'>D (腹根/运动)</text></svg>",
            "caption": "图：脊髓横切面及神经根结构",
            "options": ["A. A", "B. B", "C. C", "D. D"],
            "answer": 3,
            "explanation": "【解析】：渐冻症是由于运动神经元（传出神经元）退化所致。在脊髓中，D 为腹根（前根），内含传出神经纤维（运动神经），直接由脊髓灰质前角发出支配骨骼肌。"
          }
        ]
      }
    ],
    "subjective_sections": [
      {
        "title": "第一节：消化系统结构与消化液推断",
        "questions": [
          {
            "id": "subj_1",
            "question": "图 2 是人体的消化系统结构示意图，请回答下列各题：\n(1) 脂肪、蛋白质、淀粉分别在哪个部位开始被消化？\n(2) 现有四种消化液：III 和 IV 无肽酶；仅 I 和 III 能消化淀粉；II 的 pH 极低；I 加入 IV 后能消化脂肪而 III 加 IV 不能。写出这四种消化液的名称。\n(3) 写出小肠有利于吸收营养的三个特征。",
            "answer": "<strong>【参考标准答案与核心得分点】：</strong><br><br>1. 消化起始部位：脂肪在<span class=\"hl-mark-yellow\">小肠</span>、蛋白质在<span class=\"hl-mark-yellow\">胃</span>、淀粉在<span class=\"hl-mark-yellow\">口腔</span>。<br>2. 消化液推断：I 为<span class=\"hl-mark-green\">胰液</span>、II 为<span class=\"hl-mark-pink\">胃液</span>、III 为<span class=\"hl-mark-green\">唾液</span>、IV 为<span class=\"hl-mark-yellow\">胆汁</span>。<br>3. 小肠特征：<span class=\"hl-mark-green\">长达 5~6 米吸收时间充分</span>；<span class=\"hl-mark-yellow\">内表面有环形皱襞与绒毛极大增加面积</span>；<span class=\"hl-mark-pink\">绒毛壁仅由单层上皮细胞构成利于透过</span>。"
          }
        ]
      }
    ]
  };

  let fullDatabase = DEFAULT_DATABASE;
  let currentIdxMap = {};
  let currentColor = 'yellow';
  const HL_STORAGE_KEY = 'UEC_BIO_HL_STORE_FINAL';

  // 导航跳转控制
  function navigateHome() {
    showView('viewSubjects');
    document.getElementById('breadcrumbNav').innerHTML = `<span class="breadcrumb-item active" onclick="navigateHome()">学科选择</span>`;
  }

  function openSubject(subject) {
    if (subject === 'biology') {
      showView('viewStudy');
      document.getElementById('breadcrumbNav').innerHTML = `
        <span class="breadcrumb-item" onclick="navigateHome()">学科选择</span> &gt;
        <span class="breadcrumb-item active">生物科</span>
      `;
      renderMcqSections();
      renderSubjectiveSections();
      loadAllHighlights();
    }
  }

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const target = document.getElementById(viewId);
    if (target) target.classList.add('active');
  }

  // 尝试读取同级 JSON 文件（存在则覆盖默认数据）
  async function loadData() {
    try {
      const res = await fetch('./biology_question_bank.json');
      if (res.ok) {
        const data = await res.json();
        if (data && (data.mcq_sections || data.sections)) {
          fullDatabase = data.mcq_sections ? data : { mcq_sections: data.sections, subjective_sections: data.subjective_sections || [] };
        }
      }
    } catch (e) {
      console.log('采用内置题库数据运行。');
    }
  }

  // 渲染选择题模块
  function renderMcqSections() {
    const container = document.getElementById('mcqSectionsContainer');
    if (!container) return;
    container.innerHTML = '';
    const sections = fullDatabase.mcq_sections || [];
    sections.forEach((sec, sIdx) => {
      currentIdxMap[sIdx] = 0;
      const block = document.createElement('div');
      block.className = 'section-block';
      block.innerHTML = `
        <div class="section-header">
          <div class="section-title">📌 ${sec.title}</div>
          <div class="section-count" id="counter_${sIdx}">第 1 / ${sec.mcqs.length} 题</div>
        </div>
        <div class="flashcard">
          <div class="mcq-question" id="q_text_${sIdx}"></div>
          <div id="fig_box_${sIdx}"></div>
          <div class="mcq-options" id="opt_box_${sIdx}"></div>
          <div class="explanation" id="exp_box_${sIdx}"></div>
          <div class="card-footer">
            <button class="btn-nav" onclick="changeSectionMcq(${sIdx}, -1)">⬅️ 上一题</button>
            <button class="btn-nav" onclick="changeSectionMcq(${sIdx}, 1)">下一题 ➡️</button>
          </div>
        </div>
      `;
      container.appendChild(block);
      loadMcqCard(sIdx);
    });
  }

  function loadMcqCard(sIdx) {
    const sec = (fullDatabase.mcq_sections || [])[sIdx];
    if (!sec) return;
    const idx = currentIdxMap[sIdx] || 0;
    const item = sec.mcqs[idx];
    if (!item) return;

    document.getElementById(`counter_${sIdx}`).innerText = `第 ${idx + 1} / ${sec.mcqs.length} 题`;
    document.getElementById(`q_text_${sIdx}`).innerText = item.q;

    const figBox = document.getElementById(`fig_box_${sIdx}`);
    if (item.figure) {
      figBox.innerHTML = `
        <div class="figure-container">
          ${item.figure}
          ${item.caption ? `<div class="figure-caption">${item.caption}</div>` : ''}
        </div>`;
      figBox.style.display = 'block';
    } else {
      figBox.innerHTML = '';
      figBox.style.display = 'none';
    }

    const optBox = document.getElementById(`opt_box_${sIdx}`);
    optBox.innerHTML = '';
    const expBox = document.getElementById(`exp_box_${sIdx}`);
    expBox.style.display = 'none';
    expBox.innerText = item.explanation;

    item.options.forEach((opt, oIdx) => {
      const btn = document.createElement('div');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => {
        optBox.querySelectorAll('.option-btn').forEach((b, i) => {
          b.classList.add('disabled');
          if (i === item.answer) b.classList.add('correct');
          if (i === oIdx && oIdx !== item.answer) b.classList.add('wrong');
        });
        expBox.style.display = 'block';
      };
      optBox.appendChild(btn);
    });
  }

  function changeSectionMcq(sIdx, delta) {
    const sec = (fullDatabase.mcq_sections || [])[sIdx];
    if (!sec) return;
    const newIdx = (currentIdxMap[sIdx] || 0) + delta;
    if (newIdx >= 0 && newIdx < sec.mcqs.length) {
      currentIdxMap[sIdx] = newIdx;
      loadMcqCard(sIdx);
    }
  }

  // 渲染主观题模块
  function renderSubjectiveSections() {
    const container = document.getElementById('subjSectionsContainer');
    if (!container) return;
    container.innerHTML = '';
    const sections = fullDatabase.subjective_sections || [];
    sections.forEach(sec => {
      const block = document.createElement('div');
      block.className = 'section-block';
      let qHtml = '';
      sec.questions.forEach(q => {
        qHtml += `
          <div class="subjective-box">
            <div class="subjective-question">${q.question}</div>
            <div class="subjective-answer" id="${q.id}">${q.answer}</div>
          </div>
        `;
      });
      block.innerHTML = `
        <div class="section-header">
          <div class="section-title">📌 ${sec.title}</div>
        </div>
        ${qHtml}
      `;
      container.appendChild(block);
    });
  }

  function switchMode(mode) {
    const isMcq = mode === 'mcq';
    document.getElementById('tabMcq').classList.toggle('active', isMcq);
    document.getElementById('tabSubj').classList.toggle('active', !isMcq);
    document.getElementById('modeMcqArea').style.display = isMcq ? 'block' : 'none';
    document.getElementById('modeSubjArea').style.display = !isMcq ? 'block' : 'none';
  }

  // 高亮与划线持久化
  function setColor(color, el) {
    currentColor = color;
    document.querySelectorAll('.hl-color-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
  }

  function applyHighlight() {
    const selection = window.getSelection();
    if (!selection.rangeCount || selection.isCollapsed) return;
    const range = selection.getRangeAt(0);
    const container = document.getElementById('subjSectionsContainer');
    if (!container.contains(range.commonAncestorContainer)) return;
    const span = document.createElement('span');
    span.className = `hl-mark-${currentColor}`;
    try {
      range.surroundContents(span);
      saveAllHighlights();
    } catch (e) {
    alert("请选取同一段落中的文字进行划线。");
    }
    selection.removeAllRanges();
  }

  function saveAllHighlights() {
    const htmlData = document.getElementById('subjSectionsContainer').innerHTML;
    localStorage.setItem(HL_STORAGE_KEY, htmlData);
    showToast("划线状态已自动同步");
  }

  function loadAllHighlights() {
    const saved = localStorage.getItem(HL_STORAGE_KEY);
    if (saved) {
      document.getElementById('subjSectionsContainer').innerHTML = saved;
    }
  }

  function clearHighlights() {
    const container = document.getElementById('subjSectionsContainer');
    const marks = container.querySelectorAll('[class^="hl-mark-"]');
    marks.forEach(m => {
      const parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
    });
    saveAllHighlights();
    showToast("已清除全部划线");
  }

  function showToast(msg) {
    const toast = document.getElementById('saveToast');
    if (toast) {
      toast.innerText = msg;
      setTimeout(() => { toast.innerText = "划线状态已自动同步"; }, 2500);
    }
  }

  // 页面加载触发
  window.onload = loadData;
</script>
